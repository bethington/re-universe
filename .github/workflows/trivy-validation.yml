# TEMPORARY validation workflow -- proves the Trivy fix in real CI while
# .github/workflows/test.yml is disabled. Delete once the fix is merged.
name: Trivy Scan Validation (temporary)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  # Control: the OLD configuration. Proves the failure mode is real and
  # still present (Trivy aborts on the Maven Central 429, writes no SARIF).
  old-config-control:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy with the OLD env var
      uses: aquasecurity/trivy-action@master
      continue-on-error: true
      env:
        TRIVY_SKIP_DEPENDENCY_TREE: 'true'
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-old.sarif'
        cache: true

    - name: Report control result
      run: |
        echo "OLD config: the env var is a no-op, so Trivy still resolves the"
        echo "Maven dependency tree and hits Maven Central's rate limit."
        echo "Expected outcome: no SARIF file written, step exits non-zero."
        if [ -s trivy-old.sarif ]; then
          echo "CONTROL: SARIF was written -- Maven Central was not rate-limited"
          echo "during this run, so the control is inconclusive this time."
        else
          echo "CONTROL: no SARIF written, as expected -- the old config cannot scan."
        fi

  # The fix: TRIVY_OFFLINE_SCAN (the flag that actually exists) plus a guard
  # that fails the job when no SARIF was produced.
  fixed-config:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      env:
        TRIVY_OFFLINE_SCAN: 'true'
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        cache: true

    - name: Verify Trivy produced results
      run: |
        if [ ! -s trivy-results.sarif ]; then
          echo "::error::Trivy produced no SARIF output. The vulnerability scan did not complete; treat this as an unknown result, not a clean scan."
          exit 1
        fi
        echo "Trivy SARIF produced: $(wc -c < trivy-results.sarif) bytes"
        python3 -c 'import json,sys; d=json.load(open("trivy-results.sarif")); runs=d.get("runs") or []; r=runs[0] if runs else {}; res=r.get("results") or []; rules=(r.get("tool") or {}).get("driver",{}).get("rules") or []; print("SARIF runs: %d"%len(runs)); print("SARIF results: %d"%len(res)); print("SARIF rules: %d"%len(rules))'

    - name: Upload scan results as artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: trivy-validation-results
        path: 'trivy-results.sarif'
        if-no-files-found: warn
